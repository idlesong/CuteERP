services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cute_erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cute_erp_production
    volumes:
      - ./data/db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cute_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://cute_erp:${POSTGRES_PASSWORD}@db:5432/cute_erp_production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
    ports:
      - "3000:3000"
    volumes:
      - ./data/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
